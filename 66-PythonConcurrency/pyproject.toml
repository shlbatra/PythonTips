[project]
name = "python-concurrency"
version = "0.1.0"
description = "Python concurrency and asyncio examples"
requires-python = ">=3.10"
dependencies = [
    # Async HTTP clients
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    # Async web framework
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # Async database drivers
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    # Async utilities
    "anyio>=4.6.0",
    "aiocache>=0.12.0",
    "aiofiles>=24.1.0",
    # Task scheduling
    "apscheduler>=3.10.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
